name: Deploy development website

on:
  push:
    branches:
      - development

concurrency:
  group: development-website-deploy
  cancel-in-progress: false

env:
  APP_ROOT: /home/nexgen-academy-development/htdocs/development.nexgen-academy.com
  PM2_APP_NAME: nexgen-development-website
  PORT: "6060"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Create release archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.next' \
            --exclude='node_modules' \
            --exclude='Website.rar' \
            -czf "$RUNNER_TEMP/website-release.tgz" .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEV_SERVER_SSH_KEY }}" > ~/.ssh/development_deploy_key
          chmod 600 ~/.ssh/development_deploy_key
          grep -q "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/development_deploy_key

      - name: Prepare server deploy directory
        run: |
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "Attempt $attempt failed; retrying in 15 seconds..."
              sleep 15
            done
            "$@"
          }

          retry ssh \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -i ~/.ssh/development_deploy_key \
            -p "${{ secrets.DEV_SERVER_PORT }}" \
            "${{ secrets.DEV_SERVER_USER }}@${{ secrets.DEV_SERVER_HOST }}" \
            "set -eu; mkdir -p '${APP_ROOT}/_deploy/incoming'; echo 'Prepared deploy directory:'; ls -la '${APP_ROOT}'; ls -la '${APP_ROOT}/_deploy'"

      - name: Upload deploy script and release archive
        run: |
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "Attempt $attempt failed; retrying in 15 seconds..."
              sleep 15
            done
            "$@"
          }

          retry scp \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -i ~/.ssh/development_deploy_key \
            -P "${{ secrets.DEV_SERVER_PORT }}" \
            scripts/deploy-development-website.sh \
            "${{ secrets.DEV_SERVER_USER }}@${{ secrets.DEV_SERVER_HOST }}:${APP_ROOT}/_deploy/deploy-development-website.sh"

          retry scp \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -i ~/.ssh/development_deploy_key \
            -P "${{ secrets.DEV_SERVER_PORT }}" \
            "$RUNNER_TEMP/website-release.tgz" \
            "${{ secrets.DEV_SERVER_USER }}@${{ secrets.DEV_SERVER_HOST }}:${APP_ROOT}/_deploy/incoming/${GITHUB_SHA}.tgz"

      - name: Deploy on server
        run: |
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "Attempt $attempt failed; retrying in 15 seconds..."
              sleep 15
            done
            "$@"
          }

          retry ssh \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -i ~/.ssh/development_deploy_key \
            -p "${{ secrets.DEV_SERVER_PORT }}" \
            "${{ secrets.DEV_SERVER_USER }}@${{ secrets.DEV_SERVER_HOST }}" \
            "set -eu; echo 'Server deploy diagnostics:'; pwd; ls -la '${APP_ROOT}/_deploy'; command -v bash; command -v node || true; command -v npm || true; command -v pm2 || true; bash -lc \"bash '${APP_ROOT}/_deploy/deploy-development-website.sh' '${APP_ROOT}' '${APP_ROOT}/_deploy/incoming/${GITHUB_SHA}.tgz' '${GITHUB_SHA}' '${PM2_APP_NAME}' '${PORT}'\""
